<div class="container" style="max-width: 500px; margin: 40px auto; padding: 0 15px">
  <div class="container text-center" style="margin: 30px">
    <h3>Agregar Productos</h3>
  </div>

  <!-- Alerta dinámica de Bootstrap para éxito, error o sin conexión -->
  @if (mensajeAlerta(); as alerta) {
    <div class="alert alert-{{ alerta.tipo }} alert-dismissible fade show" role="alert">
      {{ alerta.texto }}
      <button
        type="button"
        class="btn-close"
        (click)="mensajeAlerta.set(null)"
        aria-label="Close"
      ></button>
    </div>
  }

  <form (ngSubmit)="guardarProducto()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre del Producto</label>
      <input
        type="text"
        class="form-control"
        id="nombre"
        [(ngModel)]="producto().nombre"
        name="nombre"
        required
      />
    </div>
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripcion del Producto</label>
      <input
        type="text"
        class="form-control"
        id="descripcion"
        [(ngModel)]="producto().descripcion"
        name="descripcion"
        required
      />
    </div>
    <div class="mb-3">
      <label for="precio" class="form-label">Precio del Producto</label>
      <input
        type="number"
        step="any"
        class="form-control"
        id="precio"
        placeholder="$ 0.00"
        [(ngModel)]="producto().precio"
        name="precio"
        required
      />
    </div>
    <div class="mb-3">
      <label for="stock" class="form-label">Existencia del Producto</label>
      <input
        type="number"
        class="form-control"
        id="stock"
        placeholder="00"
        [(ngModel)]="producto().stock"
        name="stock"
        required
      />
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
      <button type="submit" class="btn-outline theme-warning btn-sm me-3" [disabled]="cargando()">
       <i class="bi bi-save"> {{ cargando() ? 'Guardando....' : 'Guardar' }} </i>
      </button>

      <button type="button" class="btn-outline theme-danger btn-sm me-3" (click)="volver()">
       <i class="bi bi-back"> Volver </i> 
      </button>

      <!--<a routerLink="/productos" class="btn-outline theme-danger btn-sm me-3">Volver</a>--->

      <button type="reset" class="btn-outline theme-secondary btn-sm me-3">
        <i class="bi bi-eraser"> Limpiar </i>
      </button>
    </div>
  </form>
</div>
